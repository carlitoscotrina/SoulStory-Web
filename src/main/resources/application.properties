spring.application.name=soulstory-api

# POSTGRESQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/soulstory_db}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# SERVER
server.port=8080

# SWAGGER
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ==========================================
# EMAIL - RECUPERACION DE CONTRASEÑA
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL que usara Angular posteriormente
app.frontend.url=http://localhost:4200

# Almacenamiento local de archivos para HU-11 a HU-13
app.storage.recuerdos=uploads/recuerdos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# OPENAI - GENERACION DE IMAGENES
app.ai.image.base-url=${OPENAI_IMAGE_BASE_URL:https://api.openai.com/v1}
app.ai.image.api-key=${OPENAI_API_KEY:}
app.ai.image.model=${OPENAI_IMAGE_MODEL:gpt-image-2.5-flare}

# PASARELA DE PAGO - simulada para desarrollo local (HU-33)
app.payment.provider=${PAYMENT_PROVIDER:SIMULATED}

# ==========================================
# SEGURIDAD - JWT
# ==========================================
# Clave en Base64 (minimo 256 bits). En produccion definir la variable de entorno JWT_SECRET.
app.security.jwt.secret=${JWT_SECRET}
# Tiempo de vida del token en milisegundos (3 horas)
app.security.jwt.expiration-ms=10800000
